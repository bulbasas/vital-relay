# Example nginx vhost: host nginx terminates TLS (certbot webroot),
# the relay container listens on 127.0.0.1:8083.
server {
    listen 80;
    server_name relay.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # plain-HTTP MCP calls would leak the secret in the URL — refuse them unlogged
    location /mcp { access_log off; return 404; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name relay.example.com;
    ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 2m;
    gzip on;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml text/plain;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    # MCP URLs carry connection secrets → never written to the access log.
    # Tool calls may wait for an approval on the phone → long read timeout, no buffering.
    location /mcp {
        access_log off;
        error_log /dev/null crit;
        proxy_pass http://127.0.0.1:8083;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    # the phone's live socket
    location = /v1/ws {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:8083;
    }
}
