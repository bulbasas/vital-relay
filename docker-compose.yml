services:
  relay:
    build: .
    image: vital-relay:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8083"
      HOST: 0.0.0.0
      DB_PATH: /app/data/relay.sqlite
      # only reachable through the host's nginx, which overwrites X-Forwarded-For
      TRUST_PROXY: "true"
    ports:
      - "127.0.0.1:8083:8083"
    volumes:
      - relay-data:/app/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
volumes:
  relay-data: {}
